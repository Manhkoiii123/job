# Override: build image bằng Dockerfile thay vì Jib
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dockerfile.yml build
#   docker compose -f docker-compose.yml -f docker-compose.dockerfile.yml up -d

services:
  eureka-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.jvm
      args:
        MODULE: cloud/eureka-server
        ARTIFACT: eureka-server

  config-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.jvm
      args:
        MODULE: cloud/config-server
        ARTIFACT: config-server

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.jvm
      args:
        MODULE: cloud/api-gateway
        ARTIFACT: api-gateway

  job-user-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.jvm
      args:
        MODULE: services/job-user-service
        ARTIFACT: job-user-service

  job-portal-company-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.jvm
      args:
        MODULE: services/job-portal-company-service
        ARTIFACT: job-portal-company-service

  job-portal-job-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.jvm
      args:
        MODULE: services/job-portal-job-service
        ARTIFACT: job-portal-job-service

  job-portal-resume-service:
