      context: .
      dockerfile: docker/Dockerfile.jvm
      args:
        MODULE: services/job-portal-resume-service
        ARTIFACT: job-portal-resume-service

  job-portal-application-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.jvm
      args:
        MODULE: services/job-portal-application-service
        ARTIFACT: job-portal-application-service

  job-portal-preferences-service:
