spring:
  application:
    name: job-portal-notification-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5432/job_portal_notification
    username: postgres
    password: 123456789
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 5008

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

job:
  kafka:
    topics:
      application-status-changed: application.status.changed
  notification:
    mail-enabled: true
    from: noreply@jobportal.local
