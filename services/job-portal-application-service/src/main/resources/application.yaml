server:
  port: 5005
services:
  user:
    url: http://localhost:5001
  company:
    url: http://localhost:5002
  job:
    url: http://localhost:5003
  resume:
    url: http://localhost:5004
spring:
  application:
    name: job-portal-application-service
  datasource:
    url: jdbc:postgresql://localhost:5432/job_portal_application
    username: postgres
    password: 123456789
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
